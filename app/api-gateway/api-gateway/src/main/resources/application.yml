spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: iot-platform
          uri: lb://IOT-PLATFORM
          predicates:
            - Path=/iot/**
          filters:
            - StripPrefix=1

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"