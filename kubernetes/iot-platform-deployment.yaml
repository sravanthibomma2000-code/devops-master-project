apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-platform
  namespace: devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: iot-platform

  template:
    metadata:
      labels:
        app: iot-platform

    spec:
      containers:
      - name: iot-platform
        image: devops/iot-platform:1.0
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8081