apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: eureka-server

  template:
    metadata:
      labels:
        app: eureka-server

    spec:
      containers:
      - name: eureka-server
        image: devops/eureka-server:1.0
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8761