apiVersion: apps/v1
kind: Deployment

metadata:
  name: iot-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: iot-platform

  template:
    metadata:
      labels:
        app: iot-platform

    spec:
      containers:
      - name: iot-platform
        image: sravanthibomma2000/iot-platform:13
        imagePullPolicy: Always
        ports:
        - containerPort: 8080